:root{--bg:#f6f4ef;--paper:#fffefa;--ink:#25332f;--muted:#66736e;--line:#e4e7df;--green:#345c4e;--soft:#dfece5;--rose:#f6e8e2;--shadow:0 12px 34px #26362e0d;color-scheme:light}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:15px}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1080px;margin:auto;padding:0 22px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 0}.brand{font-weight:750;display:flex;gap:9px;align-items:center;padding:7px 0}.mark{width:32px;height:32px;background:var(--green);border-radius:11px;color:#fff;display:grid;place-items:center}.controls{display:flex;flex-direction:column;align-items:flex-end;gap:7px}.row{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn,.lang button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:8px 12px;font-size:.85rem}.btn:hover,.lang button:hover{border-color:var(--green)}.lang{display:flex;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:3px}.lang button{border:0;padding:5px 10px}.lang button[aria-pressed=true]{background:var(--green);color:#fff}.navbox{border-block:1px solid var(--line)}nav{display:flex;gap:5px;overflow:auto;white-space:nowrap;padding:9px 0;scrollbar-width:thin}nav a{flex:none;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:99px;font-size:.86rem}nav a:hover{background:var(--soft);color:var(--green)}.hero{padding:55px 0 42px;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center}.eyebrow{color:var(--green);font-size:.73rem;letter-spacing:.13em;font-weight:750}.hero h1,.section h2,.closing h2{font:500 clamp(2.2rem,5.6vw,4.3rem)/1.08 Georgia,serif;letter-spacing:-.04em;margin:14px 0}.hero p,.head p{color:var(--muted)}.hero p{font-size:1.08rem}.art{height:255px;border-radius:46% 54% 60% 40%/44% 48% 52% 56%;background:radial-gradient(circle at 60% 30%,#f2dfc2 0 14%,transparent 14.5%),radial-gradient(circle at 33% 63%,#b8d0c0 0 22%,transparent 22.5%),radial-gradient(circle at 70% 77%,#d9a98f 0 12%,transparent 12.5%),linear-gradient(135deg,#e8eee7,#f4e5de);position:relative;display:grid;place-items:center}.art:before{content:"";width:105px;height:155px;border-radius:60% 40% 52% 48%;background:linear-gradient(145deg,#7a9a84,#426b5a);transform:rotate(-25deg);opacity:.72}.art span{position:absolute;right:-3px;bottom:7px;max-width:175px;background:var(--paper);padding:12px 15px;border-radius:15px;box-shadow:var(--shadow);font-size:.85rem}.section{padding:46px 0;scroll-margin-top:12px}.head{max-width:740px;margin-bottom:22px}.section h2{font-size:clamp(1.85rem,4vw,2.8rem);margin:8px 0 12px}.head p{margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card,.group,.part,.prompt{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:19px;box-shadow:var(--shadow)}.card h3,.group h3{font-size:1.03rem;margin:0 0 8px}.card p{margin:0;color:var(--muted)}.hint{color:var(--green)!important;font-size:.9rem;margin-top:10px!important}.num{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--green);display:grid;place-items:center;font-weight:800;margin-bottom:10px}.checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.check{display:flex;gap:9px;padding:4px 0;color:var(--muted);cursor:pointer}.check input,.plan input{accent-color:var(--green);margin-top:5px;flex:none}.count{color:var(--green);font-size:.86rem;margin-top:8px}.plan{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.plan label{display:flex;gap:9px;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:14px}.plan span{color:var(--muted);font-size:.9rem}.plan strong{display:block;color:var(--ink)}.callout{background:var(--rose);border-left:4px solid #b67862;border-radius:14px;padding:16px 19px;margin:18px 0;color:#533d36}.accordion{display:grid;gap:8px;margin-top:13px}.accordion details{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0 16px}.accordion summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}.accordion summary::-webkit-details-marker{display:none}.accordion summary:after{content:"＋";color:var(--green)}.accordion details[open] summary:after{content:"−"}.accordion p{color:var(--muted);margin:0 0 15px}.bad{color:#865c52}.good{color:var(--green)}.fieldlabel{display:block;font-weight:700;margin:14px 0 7px}.field{width:100%;min-height:104px;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink);resize:vertical;line-height:1.55}.short{min-height:78px}.field:focus,button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #a8cbb7;outline-offset:2px}.prompt-list{display:grid;gap:10px}.prompt strong{display:block;margin-bottom:9px}.parts{display:grid;grid-template-columns:1fr 1fr;gap:13px}.part h3{font:500 1.35rem Georgia,serif;margin:0 0 12px}.part .prompt{padding:12px 0;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none}.part .field{min-height:78px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 5px}.primary{background:var(--green);color:#fff;border-color:var(--green)}.status{min-height:1.4em;color:var(--green);font-size:.86rem}.closing{margin:24px 0 42px;padding:28px;background:var(--green);color:#f7f9f6;border-radius:25px}.closing h2{font-size:clamp(1.8rem,3vw,2.5rem);margin:0 0 8px}.closing p{color:#dce9df}.quote{display:inline-block;border:1px solid #ffffff45;border-radius:99px;padding:6px 11px;margin:4px 5px 0 0;font-size:.88rem}.foot{border-top:1px solid var(--line);padding:24px 0 34px;text-align:center;color:var(--muted);font-size:.88rem}.foot a{color:var(--green);font-weight:750;text-decoration:none}.up{position:fixed;right:13px;bottom:13px;width:33px;height:33px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--green);font-size:14px;z-index:4}.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:5px;background:white;padding:8px;z-index:9}body.dark{--bg:#17221e;--paper:#202e28;--ink:#edf2ed;--muted:#b5c1b9;--line:#35453d;--green:#a6c8b2;--soft:#304b3d;--rose:#3c302c;--shadow:0 10px 32px #0003;color-scheme:dark}body.dark .callout{color:#f0d7cc;border-color:#c48b74}body.dark .art{filter:brightness(.78)}

<script>
const EN={"locale":"en","title":"Breakup Recovery Kit","tag":"A SELF-PACED RECOVERY GUIDE","subtitle":"A practical, compassionate space to steady yourself, make sense of the loss, and begin finding your way forward.","intro":"You don’t have to complete everything today. Take what feels useful, skip what doesn’t, and return when you’re ready.","nav":["The path","Why it hurts","Check in","Care plan","Reframe","Find yourself","Reflect","Support"],"path":["Recovery is a process, not a deadline","There is no single correct timeline. These overlapping tasks can help you choose what to focus on today.",["Acknowledge the loss","Let the ending become real. Notice what has changed, allow grief to come in waves, and lean on people you trust.","Start with basic care and connection."],["Work through what happened","Make room for feelings and recurring thoughts. Put your story into words at a pace that feels manageable.","Try the check-in, thought reframes, or writing prompts."],["Reinvest in your life","Gradually make space for interests, routines, friendships, and future hopes that belong to you.","Small steps count; dating has no set schedule."]],"why":["Why a breakup can feel so consuming","A relationship can shape our sense of safety, identity, daily routines, and future plans. Losing it can affect all of these at once.",["Connection and separation","Close bonds help us feel safe. When a bond ends, anxiety, longing, anger, or an urge to reconnect can feel strong. These are understandable responses to loss, not proof that something is wrong with you."],["A shaken sense of self","Shared routines, friendships, and interests can become intertwined. It may take time to remember what you enjoy, value, and want independently."],["Memories and reminders","A song, place, scent, or date may bring feelings back unexpectedly. Triggers are common. Pause, name what came up, and treat yourself kindly; their intensity can change over time."]],"check":["How has this been affecting you?","Select anything you have noticed in recent weeks. This is a snapshot, not a diagnosis. Naming an experience can help you care for yourself.",["In my body","Sleep changes|Digestive discomfort|Muscle tension|Racing heart or shallow breathing|Restlessness or fatigue|Nausea or dry mouth"],["In my emotions","Sadness or grief|Anger or irritability|Longing or panic|Numbness|Self-doubt or uncertainty|Hopelessness"],["In my thoughts","Replaying conversations|Analyzing my ex’s actions|Self-blame or blaming others|Difficulty concentrating|Racing or intrusive thoughts|Wanting answers or revenge"],["In my actions","Checking social media or my phone|Trying to stay available to my ex|Pulling away from people|Keeping constantly busy|Eating much more or less|Losing my usual routines"]],"help":["When to reach out for more help","Consider talking with a licensed mental health professional or doctor if distress disrupts daily life, gets worse, or does not begin to ease over several weeks. Support is especially important when there was abuse, threats, manipulation, or reliance on alcohol or drugs to cope.","If you are thinking about suicide, have a plan to harm yourself or someone else, or are in immediate danger, seek help now. In the U.S., call or text 988 for crisis support; for immediate danger or a medical emergency, call 911 or go to an emergency department.","Questions people often ask",[["Should I stay in contact with my ex?","There is no rule for everyone. Notice how contact affects your distress and ability to heal. You might gradually reduce contact or take a clearer break if interactions keep reopening the wound. If there has been abuse, coercion, or threats, prioritize safety and seek specialized support; you do not owe anyone contact."],["What if we share responsibilities, belongings, or a pet?","Keep communication brief, respectful, and focused on practical arrangements. If direct contact is too difficult, consider a trusted intermediary or a qualified mediator. Put safety first."],["What about my ex’s family?","Ask yourself what you hope to preserve. If they are an important part of your life, continued contact may make sense; if you are seeking information about or influence over your ex, it may deepen the pain. This can be another loss to grieve."],["They asked for time. Should I wait?","You can respect their request while caring for your needs. It may help to make choices as though the relationship has ended rather than putting your life on hold for an uncertain outcome."],["When should I date again?","There is no universal waiting period. Notice whether you feel curious about meeting someone, can set boundaries, and can be present rather than using dating to escape pain. You are allowed to take your time."],["What if I run into my ex?","A short, kind response and a simple exit plan can help. You do not need to explain, impress, or resolve the relationship in that moment."],["Will I ever feel better?","Many people gradually adapt, even when they cannot imagine it at first. Recovery can be uneven: a hard day does not erase the progress you have made."]]],"care":["Build a care plan for this week","Choose one realistic action in each area. Adapt these ideas to your health, culture, responsibilities, and circumstances. Supportive, not perfect.",["Rest","Try a consistent wind-down and wake-up time. Be gentle with yourself when sleep is difficult."],["Food and hydration","Aim for regular nourishment and water. Keep easy options available for low-energy days."],["Movement","Choose manageable movement, such as a short walk or stretching, if accessible to you."],["Connection","Reach out to one supportive person. Schedule a low-pressure activity or time outdoors."],["Boundaries","Notice whether contact or social media is helping. Mute, limit, or pause exposure if it intensifies distress."],["Give yourself room","When possible, postpone major decisions made in a surge of emotion. Break necessary tasks into small steps."]],"reframe":["Try a gentler, more accurate thought","Pain can make a thought feel like a fact. You do not have to force positivity. Look for a thought that includes more of the picture and leaves room for change.",["All-or-nothing thinking","“My life was only good when I was partnered.”","“There were meaningful parts of that relationship, and there can be meaning in my life now too.”"],["Overgeneralizing","“Nothing ever works out for me.”","“This relationship ended. That hurts, but it does not predict every future connection.”"],["Predicting the future","“I will never find anyone again.”","“I cannot know what the future holds. I can focus on what I need today.”"],["Mind reading","“They never cared about me.”","“I may not know exactly what they felt. The relationship mattered to me, and things have changed.”"],["Magnifying or minimizing","“This is the worst thing that could happen.” / “Our problems were nothing.”","“This is hard, and there were real problems. Both can be true.”"],["Emotional reasoning","“I feel like a failure, so I must be one.”","“I feel hurt and rejected. Those feelings do not define my worth.”"],["Should statements","“I should have known. I should have done everything differently.”","“I understand more now than I did then. I can learn without punishing myself.”"],["Blame","“It was all my fault.” / “It was all their fault.”","“I can take responsibility for my part without carrying responsibility for everything.”"]],"identity":["Who am I, outside this relationship?","You may feel less sure of yourself for a while. Use any prompt to reconnect with interests, qualities, and values. One at a time is enough.","How well do I know myself right now?|What did I enjoy before this relationship? What would I like to try again?|How might a friend describe my personality and strengths?|How would I describe myself?|How am I different from my former partner?|Who am I when I care for myself and live by my values?"],"writing":["Make sense of the relationship, at your pace","Writing can help organize memories, feelings, needs, and learning. You do not need to write beautifully or finish in one sitting. Pause if overwhelmed; ground yourself or reach out to someone supportive.","Part 1 · Understanding","What factors contributed to the relationship ending?|How did the breakup happen? Describe what you remember.|What feelings have been coming up?|What has been the hardest part?|What thoughts keep returning?|What unanswered questions are you carrying?|What do you need right now?","Part 2 · What I want to carry forward","What parts of the relationship were painful or difficult?|What parts were meaningful or positive?|What needs were not met?|What part of the relationship can you take responsibility for?|What might you want to do differently in a future relationship?|How has this experience changed or strengthened you?|What would you want a future relationship to feel like?|What would support your continued personal growth?"],"close":["You do not have to have it all figured out.","For today, one caring next step is enough. Healing can include missing someone, learning from what happened, and making a life that is yours.","I can miss what mattered and still move forward.|My feelings are real, and they can change.|I can learn without blaming myself.|I deserve care while I heal."],"ui":["Dark mode","Print notes","Download notes","Clear saved notes","Clear all notes and check-ins saved in this browser? This cannot be undone.","Saved on this device","Your writing saves automatically in this browser.","selected","Add to my plan","My reflection notes","You have not written any notes to export yet.","↑","This plan stays in this browser unless you export it.","My one small step this week","For example: take a 10-minute walk with a friend on Thursday…"],"careful":"Use what helps; leave what doesn’t. This guide is educational and does not replace professional care.","footer":"Developed by Mind X Associates"};const ZH={"locale":"zh-Hans","title":"失恋疗愈工具包","tag":"按自己的节奏，慢慢恢复","subtitle":"在这里，你可以先稳住自己，慢慢理解这段失去，并重新找到前行的方向。","intro":"你不必今天就完成所有内容。选择现在对你有帮助的部分，其他内容可以先跳过，准备好时再回来。","nav":["恢复过程","为什么这么痛","自我觉察","照顾自己","调整想法","重新认识自己","书写整理","寻求支持"],"path":["恢复是一段过程，不是期限","每个人的节奏都不同。下面这些彼此交织的任务，可以帮你决定今天先关注什么。",["承认失去","慢慢接受关系已经结束，留意生活发生了哪些变化。允许悲伤时来时去，也向信任的人寻求支持。","先照顾基本需要，保持与他人的连接。"],["梳理这段经历","给情绪和反复出现的想法一些空间。用自己能承受的速度，把经历整理成文字。","可以从下面的觉察、想法调整或书写练习开始。"],["重新投入生活","逐渐为兴趣、日常安排、友情和未来愿望留出空间，让生活再次有属于自己的部分。","小小的行动也有意义；是否开始约会没有统一时间表。"]],"why":["为什么失恋会让人如此难受","一段关系可能影响我们的安全感、自我认同、日常习惯和对未来的计划。失去关系时，这些方面可能同时受到冲击。",["依恋与分离","亲密关系能带来安全感和连接。关系结束后，焦虑、想念、愤怒或想要重新联系的冲动都可能变得强烈。这些是面对失去时可以理解的反应，并不代表你有问题。"],["自我认同受到影响","共同的日常、朋友圈和兴趣可能交织在一起。分手后，重新发现自己喜欢什么、重视什么、想要什么，可能需要一些时间。"],["记忆与触发","一首歌、一个地点、一种气味或某个日期，都可能突然带来回忆和情绪。遇到触发很常见。停下来，辨认刚才发生了什么，也试着善待自己；这些感受的强度会随时间变化。"]],"check":["这段时间，分手对你有什么影响？","勾选近几周你注意到的体验。这只是当下的自我观察，不是诊断。把感受说出来，有时更容易知道该如何照顾自己。",["身体上的变化","睡眠改变|消化不适|肌肉紧张|心跳加快或呼吸变浅|坐立不安或疲惫|恶心或口干"],["情绪上的变化","悲伤或哀痛|愤怒或烦躁|想念或恐慌|麻木|自我怀疑或不确定|绝望感"],["想法上的变化","反复回想对话|分析前任的言行|责怪自己或他人|难以集中注意力|思绪飞快或念头挥之不去|渴望得到答案或想报复"],["行为上的变化","查看社交媒体或手机|努力让自己随时能联系前任|疏远他人|让自己一直忙个不停|吃得明显多了或少了|原有生活规律被打乱"]],"help":["什么时候可以寻求更多帮助","如果痛苦已经影响日常生活、逐渐加重，或几周后仍没有缓解，可以考虑联系持证心理健康专业人员或医生。如果分手涉及虐待、威胁、操控，或你开始依赖酒精或药物应对，也尤其值得寻求支持。","如果你正在考虑自杀、已经计划伤害自己或他人，或身处即时危险中，请现在就寻求帮助。在美国，可拨打或发送短信至 988 获得危机支持；若有即时危险或医疗紧急情况，请拨打 911 或前往急诊。","大家常问的问题",[["分手后还要和前任联系吗？","没有适用于所有人的规则。留意联系对你的情绪和恢复有什么影响。你可以尝试逐步减少联系；如果每次互动都会重新带来痛苦，也可以考虑明确暂停联系。如果曾发生虐待、胁迫或威胁，请优先考虑安全并寻求专业支持；你没有义务维持联系。"],["如果还有共同责任、物品或宠物怎么办？","尽量保持沟通简短、尊重，并聚焦实际安排。如果直接联系让你很难承受，可以请信任的人协助传话，或考虑寻求合格的调解人员。安全始终优先。"],["和前任的家人还要联系吗？","想一想你希望保留这段联系的原因。如果他们本来就是你生活中重要的人，继续联系或许有意义；如果你是想打听或影响前任，可能会让痛苦延续。失去这段联系也可能需要哀悼。"],["对方说想要一些时间，我该等多久？","你可以尊重对方的请求，同时照顾自己的需要。试着按照关系已经结束来安排生活，别让自己的生活一直停在不确定的结果里。"],["什么时候适合重新约会？","没有统一的等待时间。可以留意自己是否对认识新的人感到好奇、能否设立界限，以及是否能够投入当下，而不是只想借约会逃开痛苦。你可以慢慢来。"],["如果偶然遇到前任怎么办？","简单、友善地回应，并提前想好如何离开，可能会让你更安心。你不需要当场解释、证明自己过得很好，或解决整段关系。"],["我以后真的会好起来吗？","很多人会逐渐适应，即使一开始完全想象不到。恢复可能有起伏；难熬的一天，不代表之前的进步都消失了。"]]],"care":["为这一周安排一个照顾计划","在每个方面选一个现实可行的小行动。根据自己的健康、文化、责任和生活条件做调整。目标是获得支持，而不是做到完美。",["休息","试着保持相对规律的睡前和起床时间。睡不好时，给晚上的自己多一点宽容。"],["饮食与饮水","尽量规律进食、补充水分。在精力不足的日子，准备一些容易获得的食物。"],["活动身体","如果适合你，可以选择容易做到的活动，例如短时间散步或伸展。"],["保持连接","联系一位能支持你的人。也可以约一项压力较小的活动，或找时间去户外走走。"],["设立界限","留意联系前任或查看社交媒体是否对你有帮助。如果总让你更难受，可以静音、减少或暂时停止接触。"],["给自己一点空间","条件允许时，避免在情绪特别强烈时做重大决定。必须完成的事情也可以拆成更小的步骤。"]],"reframe":["把想法调整得温和、准确一些","痛苦会让某个想法听起来像事实。你不必强迫自己积极，可以试着补充更多信息，让想法更完整，也给改变留出空间。",["非黑即白","“只有恋爱的时候，我的生活才是好的。”","“这段关系里有珍贵的部分；现在的生活也仍可能有意义。”"],["以偏概全","“我做什么都不会成功。”","“这段关系结束了，这很痛苦，但不能决定我以后所有的关系。”"],["预测未来","“我以后再也找不到伴侣了。”","“我无法知道未来会怎样。今天我可以先关注自己的需要。”"],["揣测他人想法","“对方从来没有在乎过我。”","“我未必知道对方当时的全部感受。这段关系曾对我很重要，而现在已经改变了。”"],["放大或缩小","“这是可能发生的最糟糕的事。”／“我们的矛盾根本不算什么。”","“这件事确实很难；关系里也确实存在问题。这两件事可以同时成立。”"],["把情绪当事实","“我觉得自己很失败，所以我一定很失败。”","“我现在感到受伤和被拒绝，但这些感受不能定义我的价值。”"],["应该如此","“我早就应该看出来。我本应该做得完全不一样。”","“现在的我比当时了解得更多。我可以从中学习，而不必惩罚自己。”"],["归咎责任","“都是我的错。”／“全都是对方的错。”","“我可以为自己的部分负责，但不必承担全部责任。”"]],"identity":["离开这段关系，我是谁？","你暂时不太确定自己是谁，是可以理解的。可以用下面的问题重新发现自己的兴趣、特点和价值观。一次回答一个问题也可以。","此刻，我对自己了解多少？|进入这段关系之前，我喜欢做什么？现在有什么想重新尝试？|朋友可能会怎样描述我的性格和优点？|我会怎样描述自己？|我有哪些方面和前任不一样？|当我照顾自己、按照自己的价值观生活时，我是谁？"],"writing":["按照自己的节奏，整理这段关系","书写可以帮助你整理记忆、感受、需要和收获。你不需要写得漂亮，也不必一次完成。如果感到不堪重负，可以先停下来，做些让自己安定的事，或联系能支持你的人。","第一部分 · 理解经历","哪些因素促成了这段关系的结束？|分手是如何发生的？写下你记得的过程。|最近有哪些感受反复出现？|这次分手最难熬的部分是什么？|哪些想法总是反复出现？|你心里还带着哪些没有答案的问题？|此刻你最需要什么？","第二部分 · 我想带走的经验","这段关系中有哪些痛苦或困难的部分？|这段关系中有哪些珍贵或积极的部分？|有哪些需要没有得到满足？|对于这段关系，你愿意为自己的哪些部分负责？|如果有下一段关系，你希望自己有哪些不同做法？|这段经历如何改变了你，或让你变得更有力量？|你希望未来的关系带给你什么感受？|什么能支持你继续成长？"],"close":["你不必现在就把一切都想明白。","今天，迈出一个照顾自己的小步就够了。疗愈可以包含想念一个曾经重要的人、从经历中学习，也可以包含慢慢建立属于自己的生活。","我可以怀念重要的部分，也可以继续向前。|我的感受是真实的，也会发生变化。|我可以学习，而不必责怪自己。|疗愈的过程中，我也值得被好好对待。"],"ui":["深色模式","打印笔记","下载笔记","清除已保存的笔记","要清除此浏览器里保存的所有笔记和自我觉察吗？清除后无法恢复。","已保存在此设备","你的书写会自动保存在此浏览器中。","项已选择","加入我的计划","我的反思笔记","目前还没有可导出的笔记。","↑","这份计划只保存在当前浏览器中，除非你选择导出。","我这周想尝试的一件小事","例如：周四和朋友散步十分钟……"],"careful":"只保留对你有帮助的部分，其他内容可以略过。本指南用于教育和自我反思，不能代替专业照护。","footer":"Mind X社区"};const T={"locale":"zh-Hant","title":"失戀療癒工具包","tag":"按自己的節奏，慢慢恢復","subtitle":"在這裡，你可以先穩住自己，慢慢理解這段失去，並重新找到前行的方向。","intro":"你不必今天就完成所有內容。選擇現在對你有幫助的部分，其他內容可以先跳過，準備好時再回來。","nav":["恢復過程","為什麼這麼痛","自我覺察","照顧自己","調整想法","重新認識自己","書寫整理","尋求支援"],"path":["恢復是一段過程，不是期限","每個人的节奏都不同。下面這些彼此交織的任務，可以幫你决定今天先關注什麼。",["承認失去","慢慢接受關係已經結束，留意生活發生了哪些變化。允许悲傷時來時去，也向信任的人尋求支援。","先照顧基本需要，保持與他人的连接。"],["梳理這段經歷","給情緒和反復出現的想法一些空間。用自己能承受的速度，把經歷整理成文字。","可以從下面的覺察、想法調整或書寫練習開始。"],["重新投入生活","逐漸為兴趣、日常安排、友情和未來願望留出空間，讓生活再次有屬于自己的部分。","小小的行動也有意義；是否開始约會沒有統一時間表。"]],"why":["為什麼失恋會讓人如此難受","一段關係可能影響我們的安全感、自我認同、日常習慣和對未來的計畫。失去關係時，這些方面可能同時受到冲擊。",["依恋與分離","親密關係能帶來安全感和连接。關係結束後，焦慮、想念、憤怒或想要重新聯絡的冲動都可能變得强烈。這些是面對失去時可以理解的反應，并不代表你有問題。"],["自我認同受到影響","共同的日常、朋友圈和兴趣可能交織在一起。分手後，重新發現自己喜欢什麼、重视什麼、想要什麼，可能需要一些時間。"],["記憶與觸發","一首歌、一個地點、一種氣味或某個日期，都可能突然帶來回憶和情緒。遇到觸發很常見。停下來，辨認刚才發生了什麼，也試着善待自己；這些感受的强度會隨時間變化。"]],"check":["這段時間，分手對你有什麼影響？","勾選近几周你注意到的體驗。這只是當下的自我觀察，不是診断。把感受說出來，有時更容易知道該如何照顧自己。",["身體上的變化","睡眠改變|消化不适|肌肉緊張|心跳加快或呼吸變浅|坐立不安或疲惫|恶心或口干"],["情緒上的變化","悲傷或哀痛|憤怒或烦躁|想念或恐慌|麻木|自我懷疑或不确定|絕望感"],["想法上的變化","反復回想對話|分析前任的言行|責怪自己或他人|難以集中注意力|思緒飞快或念頭挥之不去|渴望得到答案或想报復"],["行為上的變化","查看社群媒體或手机|努力讓自己隨時能聯絡前任|疏遠他人|讓自己一直忙個不停|吃得明顯多了或少了|原有生活規律被打乱"]],"help":["什麼時候可以寻求更多幫助","如果痛苦已經影響日常生活、逐漸加重，或几周後仍沒有緩解，可以考慮聯絡持證心理健康專業人員或醫生。如果分手涉及虐待、威胁、操控，或你開始依赖酒精或藥物應對，也尤其值得尋求支援。","如果你正在考慮自殺、已經計畫傷害自己或他人，或身處即時危險中，請現在就寻求幫助。在美國，可撥打或發送簡訊至 988 获得危机支持；若有即時危險或醫療緊急情况，請撥打 911 或前往急診。","大家常問的問題",[["分手後還要和前任聯絡嗎？","沒有适用于所有人的規則。留意聯絡對你的情緒和恢復有什麼影響。你可以嘗試逐步減少聯絡；如果每次互動都會重新帶來痛苦，也可以考慮明确暫停聯絡。如果曾發生虐待、胁迫或威胁，請优先考慮安全并寻求專業支持；你沒有義務维持聯絡。"],["如果還有共同責任、物品或寵物怎麼辦？","盡量保持沟通簡短、尊重，并聚焦實際安排。如果直接聯絡讓你很難承受，可以請信任的人协助傳話，或考慮寻求合格的調解人員。安全始终优先。"],["和前任的家人還要聯絡嗎？","想一想你希望保留這段聯絡的原因。如果他們本來就是你生活中重要的人，繼續聯絡或许有意義；如果你是想打聽或影響前任，可能會讓痛苦延續。失去這段聯絡也可能需要哀悼。"],["對方說想要一些時間，我該等多久？","你可以尊重對方的請求，同時照顧自己的需要。試着按照關係已經結束來安排生活，別讓自己的生活一直停在不确定的結果裡。"],["什麼時候适合重新约會？","沒有統一的等待時間。可以留意自己是否對認識新的人感到好奇、能否设立界線，以及是否能夠投入當下，而不是只想借约會逃開痛苦。你可以慢慢來。"],["如果偶然遇到前任怎麼辦？","簡單、友善地回應，并提前想好如何離開，可能會讓你更安心。你不需要当场解釋、證明自己過得很好，或解决整段關係。"],["我以後真的會好起來嗎？","很多人會逐漸适應，即使一開始完全想象不到。恢復可能有起伏；難熬的一天，不代表之前的进步都消失了。"]]],"care":["為這一週安排一個照顧計畫","在每個方面選一個現實可行的小行動。根據自己的健  x+=`<section class="section" id="care">${head(d.care[0],d.care[1],'SMALL, STEADY SUPPORT')}<div class="plan">${d.care.slice(2).map((c,i)=>`<label><input type="checkbox" data-check="plan-${i}"><span><strong>${esc(c[0])}</strong>${esc(c[1])}</span></label>`).join('')}</div><label class="fieldlabel" for="weekly">${esc(u[13])}</label>${ta('weekly',u[14],true)}<p class="notehint">${esc(u[12])}</p></section>`;

 let z=store();document.querySelectorAll('[data-note]').forEach(el=>{el.value=z[el.dataset.note]||'';el.addEventListener('input',()=>put(el.dataset.note,el.value))});document.querySelectorAll('[data-check]').forEach(el=>{el.checked=!!z[el.dataset.check];el.addEventListener('change',()=>{put(el.dataset.check,el.checked);count()})});count();document.getElementById('download').onclick=downloadNotes;document.getElementById('download2').onclick=downloadNotes;document.getElementById('print').onclick=printNotes;document.getElementById('print2').onclick=printNotes;document.getElementById('clear').onclick=clearAll;

function count(){let el=document.getElementById('count');if(el)el.textContent=[...document.querySelectorAll('[data-check]')].filter(x=>x.checked).length+' '+D().ui[7]}
function entries(){let d=D(),o=store(),labels={weekly:d.ui[13],thought:d.reframe[0],balanced:lang==='en'?'A more balanced response':lang==='zh-Hant'?'更平衡的回應':'更平衡的回应'};split(d.identity[2]).forEach((q,i)=>labels['identity-'+i]=q);[3,5].forEach((idx,pi)=>split(d.writing[idx]).forEach((q,i)=>labels['write-'+pi+'-'+i]=q));return Object.entries(labels).map(([k,v])=>[v,o[k]||'']).filter(v=>v[1].trim())}

document.getElementById('dark').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem(K+'-dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem(K+'-dark')==='1')document.body.classList.add('dark');document.getElementById('up').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});render();
